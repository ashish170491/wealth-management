<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same CSP as every other page (SPEC 27.3 / B-070): every source is 'self', so the
     dashboard cannot silently gain an external dependency; style-src carries 'unsafe-inline'
     because ui.js sets element styles via the style attribute, and el() refuses raw html so
     markup injection stays structurally impossible. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'">
<title>Themes &middot; Portfolio Dashboard</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="view"></main>
<script type="module" src="js/page-themes.js"></script>
</body>
</html>
